name: TVPlayer
options:
  bundleIdPrefix: de.beutner
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: Z5JV9S33V5

targetTemplates:
  SharedApp:
    type: application
    sources:
      - path: TVPlayer
        excludes:
          - Resources/Info-tvOS.plist
          - Resources/Info-iOS.plist
          - Resources/Info-macOS.plist
          - Resources/TVPlayer.entitlements
          - Resources/TVPlayer-iOS.entitlements
          - Resources/TVPlayer-macOS.entitlements
          - Resources/playback-replay.jsonl
          - Resources/guide-focus-fixture.json
      - path: LICENSES/LGPL-2.1.txt
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: de.beutner.TVPlayer
        PRODUCT_MODULE_NAME: TVPlayer
        PRODUCT_NAME: TVPlayer

  SharedTests:
    type: bundle.unit-test
    sources:
      - path: TVPlayerTests
    settings:
      base:
        PRODUCT_MODULE_NAME: TVPlayerTests
        GENERATE_INFOPLIST_FILE: true

targets:
  TVPlayer:
    templates:
      - SharedApp
    platform: tvOS
    dependencies:
      - framework: .build/VLCKit/VLCKit.xcframework
        embed: true
      - target: TVPlayerTopShelf
        embed: true
    sources:
      - path: TVPlayerTVOSPlayback
      - path: TVPlayer/Resources/playback-replay.jsonl
        buildPhase: resources
      - path: TVPlayer/Resources/guide-focus-fixture.json
        buildPhase: resources
    info:
      path: TVPlayer/Resources/Info-tvOS.plist
      properties:
        CFBundleDisplayName: TV Player
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: TV Player discovers and connects to your Tvheadend server on the local network.
        NSBonjourServices:
          - _tvplayer._tcp
          - _tvplayer-guide._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        GCSupportedGameControllers:
          - ProfileName: DirectionalGamepad
          - ProfileName: MicroGamepad
        GCSupportsControllerUserInteraction: true
        GCSupportsMultipleMicroGamepads: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: de.beutner.TVPlayer.playback
            CFBundleURLSchemes:
              - tvplayer
        NSUserActivityTypes:
          - com.apple.tv.useractivity.channel-guide
        UIBackgroundModes:
          - audio
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - de.beutner.TVPlayer.refresh-guide
        UILaunchScreen: {}
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: TVPlayer/Resources/TVPlayer.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: TVPlayerTVOSPlayback/TVPlayer-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)/VLCKit.framework/Headers"
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: playback-replay.jsonl guide-focus-fixture.json
    scheme:
      testTargets:
        - TVPlayerTests
        - TVPlayerPlaybackUITests

  TVPlayerTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: TVPlayerTopShelf
      - path: TVPlayer/TopShelf/TopShelfSnapshot.swift
    info:
      path: TVPlayerTopShelf/Info.plist
      properties:
        CFBundleDisplayName: TV Player Top Shelf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).TopShelfProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.beutner.TVPlayer.TopShelf
        CODE_SIGN_ENTITLEMENTS: TVPlayer/Resources/TVPlayerTopShelf.entitlements
        SKIP_INSTALL: true
        SWIFT_VERSION: "6.0"

  TVPlayer-iOS:
    templates:
      - SharedApp
    platform: iOS
    sources:
      - path: TVPlayer/Resources/playback-replay.jsonl
        buildPhase: resources
    dependencies:
      - framework: .build/VLCKit/VLCKit.xcframework
        embed: true
    info:
      path: TVPlayer/Resources/Info-iOS.plist
      properties:
        CFBundleDisplayName: TV Player
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: TV Player discovers and connects to your Tvheadend server on the local network.
        NSBonjourServices:
          - _tvplayer._tcp
          - _tvplayer-guide._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - de.beutner.TVPlayer.refresh-guide
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Mobile
        CODE_SIGN_ENTITLEMENTS: TVPlayer/Resources/TVPlayer-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - TVPlayerTests-iOS
        - TVPlayerPlaybackUITests-iOS

  TVPlayer-macOS:
    templates:
      - SharedApp
    platform: macOS
    dependencies:
      - framework: .build/VLCKit/VLCKit.xcframework
        embed: true
    info:
      path: TVPlayer/Resources/Info-macOS.plist
      properties:
        CFBundleDisplayName: TV Player
        CFBundleName: TV Player
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.video
        NSHumanReadableCopyright: Copyright © 2026 Gunnar Beutner
        NSLocalNetworkUsageDescription: TV Player discovers and connects to your Tvheadend server on the local network.
        NSBonjourServices:
          - _tvplayer._tcp
          - _tvplayer-guide._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Mac
        CODE_SIGN_ENTITLEMENTS: TVPlayer/Resources/TVPlayer-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: true
    scheme:
      testTargets:
        - TVPlayerTests-macOS

  TVPlayerTests:
    templates:
      - SharedTests
    platform: tvOS
    dependencies:
      - target: TVPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.beutner.TVPlayer.tests

  TVPlayerPlaybackUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: TVPlayerPlaybackUITests
    dependencies:
      - target: TVPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: de.beutner.TVPlayer.playback-ui-tests
        TEST_TARGET_NAME: TVPlayer

  TVPlayerPlaybackUITests-iOS:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TVPlayerIOSUITests
    dependencies:
      - target: TVPlayer-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: de.beutner.TVPlayer.playback-ui-tests.ios
        TEST_TARGET_NAME: TVPlayer-iOS

  TVPlayerTests-iOS:
    templates:
      - SharedTests
    platform: iOS
    dependencies:
      - target: TVPlayer-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.beutner.TVPlayer.tests.ios
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TVPlayer.app/TVPlayer"

  TVPlayerTests-macOS:
    templates:
      - SharedTests
    platform: macOS
    dependencies:
      - target: TVPlayer-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.beutner.TVPlayer.tests.macos
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TVPlayer.app/Contents/MacOS/TVPlayer"
