name: tvplayer-discovery

services:
  announcer:
    build:
      context: .
    network_mode: host
    restart: unless-stopped
    environment:
      TVPLAYER_TVH_URL: ${TVPLAYER_TVH_URL:?Set TVPLAYER_TVH_URL in .env}
      TVPLAYER_TVH_USERNAME: ${TVPLAYER_TVH_USERNAME:?Set TVPLAYER_TVH_USERNAME in .env}
      TVPLAYER_TVH_PASSWORD: ${TVPLAYER_TVH_PASSWORD:?Set TVPLAYER_TVH_PASSWORD in .env}
      TVPLAYER_TVH_PROFILE: ${TVPLAYER_TVH_PROFILE:-pass}
      TVPLAYER_XMLTV_URL: ${TVPLAYER_XMLTV_URL:-}
      TVPLAYER_GUIDE_PORT: ${TVPLAYER_GUIDE_PORT:-49382}
      TVPLAYER_GUIDE_BIND: ${TVPLAYER_GUIDE_BIND:-0.0.0.0}
      TVPLAYER_GUIDE_REFRESH_SECONDS: ${TVPLAYER_GUIDE_REFRESH_SECONDS:-60}
      TVPLAYER_GUIDE_RETENTION_HOURS: ${TVPLAYER_GUIDE_RETENTION_HOURS:-24}
      TVPLAYER_GUIDE_FUTURE_HOURS: ${TVPLAYER_GUIDE_FUTURE_HOURS:-72}
      TVPLAYER_GUIDE_EVENT_LIMIT: ${TVPLAYER_GUIDE_EVENT_LIMIT:-50000}
      TVPLAYER_GUIDE_CACHE_PATH: /data/guide-cache.json
      TVPLAYER_MDNS_NAME: ${TVPLAYER_MDNS_NAME:-TVPlayer TVHeadend}
      TVPLAYER_MDNS_ADDRESS: ${TVPLAYER_MDNS_ADDRESS:-}
    volumes:
      - guide-cache:/data

volumes:
  guide-cache:
